  <style>
/* ==========================================================================
   Happy Birthday — Lovers Edition
   Palet: blush · rose · mauve  |  Serif elegan + script + rounded sans
   ========================================================================== */

:root {
  --blush-50:  #fff7fa;
  --blush-100: #ffeef4;
  --blush-200: #ffdce8;
  --rose-300:  #ffb3cb;
  --rose-400:  #ff85ab;
  --rose-500:  #f2578a;
  --rose-600:  #d93a72;
  --rose-700:  #b02358;
  --mauve-300: #e6c4f0;
  --mauve-400: #cf9ee0;
  --ink-900:   #3a1f2e;
  --ink-700:   #5c3a4b;
  --ink-500:   #8a6577;

  --font-display: "Playfair Display", "Lora", Georgia, "Times New Roman", serif;
  --font-script:  "Dancing Script", "Brush Script MT", cursive;
  --font-body:    "Quicksand", "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --radius-card: 32px;
  --shadow-card: 0 30px 60px -20px rgba(217, 58, 114, .28),
                 0 12px 24px -12px rgba(176, 35, 88, .18);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  touch-action: pan-y;
}

html, body {
  margin: 0;
  min-height: 100%;
  touch-action: pan-y;
}

body {
  font-family: var(--font-body);
  color: var(--ink-700);
  background: var(--blush-100);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

img { display: block; max-width: 100%; -webkit-user-drag: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- Latar belakang ------------------------------------------------ */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 15% 0%,  #ffe3ee 0%, transparent 55%),
    radial-gradient(110% 90% at 100% 100%, #f3d7f7 0%, transparent 55%),
    linear-gradient(160deg, #fff1f6 0%, #ffe4ee 45%, #f6dcf3 100%);
}

.bg__blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: .55;
  will-change: transform;
}
.bg__blob--1 { width: 340px; height: 340px; top: -90px;  left: -90px;  background: #ff9dbd; animation: drift1 22s ease-in-out infinite alternate; }
.bg__blob--2 { width: 300px; height: 300px; bottom: -80px; right: -80px; background: #d9a6ee; animation: drift2 26s ease-in-out infinite alternate; }
.bg__blob--3 { width: 220px; height: 220px; top: 42%; left: 55%; background: #ffc2d6; opacity: .45; animation: drift3 30s ease-in-out infinite alternate; }

@keyframes drift1 { to { transform: translate(60px, 90px) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-70px, -60px) scale(1.2); } }
@keyframes drift3 { to { transform: translate(-90px, 70px) scale(.9); } }

/* Hati melayang (SVG, bukan emoji) */
.hearts {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.heart {
  position: absolute;
  bottom: -40px;
  width: var(--s, 18px);
  height: var(--s, 18px);
  color: var(--c, #ff85ab);
  opacity: 0;
  animation: floatUp var(--d, 14s) linear var(--delay, 0s) infinite;
  will-change: transform, opacity;
}
.heart svg { width: 100%; height: 100%; display: block; fill: currentColor; }

@keyframes floatUp {
  0%   { transform: translate3d(0, 0, 0) rotate(-8deg) scale(.8); opacity: 0; }
  12%  { opacity: var(--o, .55); }
  50%  { transform: translate3d(var(--x, 20px), -55vh, 0) rotate(10deg) scale(1); }
  88%  { opacity: var(--o, .55); }
  100% { transform: translate3d(calc(var(--x, 20px) * -1), -112vh, 0) rotate(-6deg) scale(1.1); opacity: 0; }
}

/* ---------- Tombol musik (pojok kanan atas) ------------------------------- */
.music-btn {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  right: max(14px, env(safe-area-inset-right));
  z-index: 50;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--rose-600);
  background: rgba(255, 255, 255, .78);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, .95);
  box-shadow: 0 10px 24px -8px rgba(217, 58, 114, .4), inset 0 1px 0 rgba(255,255,255,.9);
  transition: transform .25s var(--ease-out), color .25s, background .25s;
}
.music-btn:hover  { transform: translateY(-2px); }
.music-btn:active { transform: scale(.9); }
.music-btn:focus-visible { outline: 3px solid rgba(242, 87, 138, .5); outline-offset: 3px; }

.music-btn svg { width: 22px; height: 22px; overflow: visible; }
.music-btn .slash {
  stroke: currentColor;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-dasharray: 26;
  stroke-dashoffset: 26;
  opacity: 0;
  transition: stroke-dashoffset .3s var(--ease-out), opacity .2s;
}
.music-btn .slash-outline {
  stroke: rgba(255, 255, 255, .95);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 26;
  stroke-dashoffset: 26;
  opacity: 0;
  transition: stroke-dashoffset .3s var(--ease-out), opacity .2s;
}

/* Status: mati -> ikon redup + garis miring */
.music-btn[data-state="off"] { color: var(--ink-500); }
.music-btn[data-state="off"] .note { opacity: .75; }
.music-btn[data-state="off"] .slash,
.music-btn[data-state="off"] .slash-outline { stroke-dashoffset: 0; opacity: 1; }

/* Status: nyala -> denyut halus */
.music-btn[data-state="on"]::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  border: 2px solid rgba(242, 87, 138, .45);
  animation: pulse 2.2s ease-out infinite;
  pointer-events: none;
}
@keyframes pulse {
  0%   { transform: scale(1);   opacity: .9; }
  100% { transform: scale(1.55); opacity: 0; }
}

/* ---------- Layout utama -------------------------------------------------- */
.stage {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 84px 18px 40px;
}

.card {
  position: relative;
  width: 100%;
  max-width: 420px;
  border-radius: var(--radius-card);
  padding: 34px 26px 30px;
  text-align: center;
  background:
    linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,246,250,.78));
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  backdrop-filter: blur(22px) saturate(150%);
  box-shadow: var(--shadow-card);
  isolation: isolate;
}

/* Bingkai gradient tipis di sekeliling kartu */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.5px;
  background: linear-gradient(140deg, #ffffff 0%, #ffb3cb 40%, #e6c4f0 75%, #ffffff 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  pointer-events: none;
  z-index: -1;
}

/* Kilau lembut di sudut kartu */
.card::after {
  content: "";
  position: absolute;
  top: -60px; right: -50px;
  width: 190px; height: 190px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 179, 203, .55), transparent 70%);
  pointer-events: none;
  z-index: -1;
}

/* ---------- Progress ------------------------------------------------------ */
.progress {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin-bottom: 22px;
}
.progress i {
  display: block;
  height: 5px;
  width: 20px;
  border-radius: 99px;
  background: rgba(217, 58, 114, .16);
  transition: width .4s var(--ease-out), background .3s;
}
.progress i.done { background: rgba(242, 87, 138, .5); }
.progress i.now  { width: 34px; background: linear-gradient(90deg, var(--rose-500), var(--rose-400)); }

/* ---------- Slide --------------------------------------------------------- */
.slide {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 0;
  justify-content: center;
}
.slide.is-in  { animation: slideIn  .6s var(--ease-out) both; }
.slide.is-out { animation: slideOut .32s cubic-bezier(.7, 0, .84, 0) both; }

@keyframes slideIn  { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes slideOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-14px) scale(.97); } }

/* Stagger untuk isi slide */
.slide.is-in > * { animation: rise .7s var(--ease-out) both; }
.slide.is-in > *:nth-child(1) { animation-delay: .05s; }
.slide.is-in > *:nth-child(2) { animation-delay: .14s; }
.slide.is-in > *:nth-child(3) { animation-delay: .22s; }
.slide.is-in > *:nth-child(4) { animation-delay: .30s; }
.slide.is-in > *:nth-child(5) { animation-delay: .38s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- GIF ----------------------------------------------------------- */
.gif {
  position: relative;
  width: min(250px, 66vw);
  aspect-ratio: 1 / 1;
  margin: 0 0 22px;
  border-radius: 28px;
  padding: 6px;
  background: linear-gradient(145deg, #ffffff, #ffe3ee);
  box-shadow:
    0 18px 34px -14px rgba(217, 58, 114, .42),
    0 0 0 1px rgba(255, 179, 203, .55);
}
.gif img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 22px;
  background: #fff;
}
/* GIF dengan latar hitam: penuhi bingkai supaya tidak ada kotak putih */
.gif--dark { background: linear-gradient(145deg, #2a1a24, #4a2a3c); }
.gif--dark img { background: #000; object-fit: cover; }
/* GIF latar krem */
.gif--cream img { background: #f7ece3; }

/* ---------- Foto ---------------------------------------------------------- */
.photos {
  display: grid;
  gap: 14px;
  width: 100%;
  margin: 0 0 22px;
  justify-content: center;
}
.photos--pair { grid-template-columns: 1fr 1fr; max-width: 340px; }
.photos--single { grid-template-columns: 1fr; max-width: 210px; }

.polaroid {
  position: relative;
  background: #fff;
  padding: 8px 8px 30px;
  border-radius: 6px;
  box-shadow:
    0 16px 30px -12px rgba(120, 30, 70, .38),
    0 0 0 1px rgba(255, 179, 203, .35);
  transition: transform .4s var(--ease-out);
}
.polaroid img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 2px;
}
.photos--single .polaroid img { aspect-ratio: 4 / 5; object-position: 50% 62%; }

.photos--pair .polaroid:nth-child(1) { transform: rotate(-4.5deg) translateY(4px); }
.photos--pair .polaroid:nth-child(2) { transform: rotate(4deg)  translateY(-4px); }
.photos--single .polaroid            { transform: rotate(-2deg); }

/* pita kecil di atas polaroid */
.polaroid::before {
  content: "";
  position: absolute;
  top: -11px; left: 50%;
  width: 54px; height: 20px;
  transform: translateX(-50%) rotate(-3deg);
  background: linear-gradient(180deg, rgba(255, 179, 203, .85), rgba(255, 133, 171, .75));
  border-radius: 3px;
  box-shadow: 0 2px 4px rgba(217, 58, 114, .2);
}

/* ---------- Tipografi ----------------------------------------------------- */
.eyebrow {
  font-family: var(--font-script);
  font-size: 1.5rem;
  line-height: 1;
  color: var(--rose-500);
  margin: 0 0 6px;
}

.title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.55rem, 6.6vw, 2.05rem);
  line-height: 1.18;
  letter-spacing: -.01em;
  color: var(--ink-900);
  margin: 0 0 8px;
  text-wrap: balance;
}
.title em {
  font-style: italic;
  font-weight: 700;
  background: linear-gradient(100deg, var(--rose-600), var(--rose-400) 60%, #c77dff);
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--rose-500);
}

.kaomoji {
  font-size: 1.15rem;
  color: var(--rose-600);
  margin: 0 0 12px;
  letter-spacing: .08em;
}

.text {
  font-size: 1.02rem;
  font-weight: 500;
  line-height: 1.7;
  color: var(--ink-700);
  max-width: 320px;
  margin: 0 0 26px;
  text-wrap: pretty;
}
.text--lead {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: 1.14rem;
  line-height: 1.6;
  color: var(--ink-900);
}
.text--lead:has(+ .text--sub) { margin-bottom: 12px; }
.text--sub { font-size: .95rem; color: var(--ink-500); }

/* ---------- Tombol -------------------------------------------------------- */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 15px 34px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 1.02rem;
  letter-spacing: .02em;
  color: #fff;
  background: linear-gradient(135deg, var(--rose-500) 0%, #e9457f 50%, #c93a8f 100%);
  box-shadow:
    0 14px 26px -10px rgba(217, 58, 114, .65),
    inset 0 1px 0 rgba(255, 255, 255, .35);
  overflow: hidden;
  transition: transform .25s var(--ease-out), box-shadow .25s;
}
.btn::before {
  content: "";
  position: absolute;
  top: 0; left: -120%;
  width: 60%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
  transform: skewX(-20deg);
  animation: shine 3.6s ease-in-out infinite;
}
@keyframes shine { 0%, 60% { left: -120%; } 100% { left: 160%; } }
.btn:hover  { transform: translateY(-2px); box-shadow: 0 18px 30px -10px rgba(217, 58, 114, .7), inset 0 1px 0 rgba(255,255,255,.35); }
.btn:active { transform: translateY(1px) scale(.96); }
.btn:focus-visible { outline: 3px solid rgba(242, 87, 138, .5); outline-offset: 3px; }
.btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }

.btn--ghost {
  padding: 12px 24px;
  font-size: .92rem;
  color: var(--rose-600);
  background: rgba(255, 255, 255, .8);
  box-shadow: 0 0 0 1.5px rgba(242, 87, 138, .35), 0 8px 18px -10px rgba(217, 58, 114, .4);
}
.btn--ghost::before { display: none; }

/* ---------- Surat --------------------------------------------------------- */
.letter-head { margin-bottom: 14px; }
.letter-head .title { font-size: clamp(1.25rem, 5.4vw, 1.6rem); }

.letter {
  position: relative;
  width: 100%;
  text-align: left;
  border-radius: 20px;
  padding: 20px 18px 20px 22px;
  margin-bottom: 20px;
  background:
    repeating-linear-gradient(180deg, transparent 0 27px, rgba(242, 87, 138, .1) 27px 28px),
    linear-gradient(180deg, #fffdfd, #fff4f8);
  box-shadow: 0 14px 28px -16px rgba(217, 58, 114, .4), 0 0 0 1px rgba(255, 179, 203, .5);
}
.letter::before {
  content: "";
  position: absolute;
  top: 16px; bottom: 16px; left: 10px;
  width: 2px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--rose-400), var(--mauve-400));
  opacity: .7;
}
.letter__body {
  height: 300px;
  overflow-y: auto;
  padding: 0 6px 0 12px;
  scrollbar-width: thin;
  scrollbar-color: rgba(242, 87, 138, .4) transparent;
  -webkit-overflow-scrolling: touch;
  user-select: text;
  -webkit-user-select: text;
}
.letter__body::-webkit-scrollbar { width: 5px; }
.letter__body::-webkit-scrollbar-thumb { background: rgba(242, 87, 138, .35); border-radius: 9px; }

.letter__text {
  margin: 0;
  font-family: var(--font-body);
  font-size: .98rem;
  font-weight: 500;
  line-height: 1.75;
  color: var(--ink-700);
  white-space: pre-line;
}
.letter__text.typing::after {
  content: "";
  display: inline-block;
  width: 2px; height: 1.05em;
  margin-left: 2px;
  vertical-align: -.15em;
  background: var(--rose-500);
  animation: caret .8s steps(1) infinite;
}
@keyframes caret { 50% { opacity: 0; } }

.letter-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ---------- Responsif & aksesibilitas ------------------------------------ */
@media (max-width: 360px) {
  .stage { padding: 70px 12px 20px; }
  .card  { padding: 24px 16px 22px; }
  .gif   { width: min(210px, 58vw); margin-bottom: 16px; }
  .photos { margin-bottom: 16px; }
  .photos--single .polaroid img { aspect-ratio: 1 / 1; }
  .title { margin-bottom: 4px; }
  .text  { margin-bottom: 18px; }
  .progress { margin-bottom: 14px; }
}
@media (max-height: 680px) {
  .stage { padding-top: 64px; align-items: flex-start; }
  .gif   { margin-bottom: 14px; }
  .photos { margin-bottom: 14px; }
  .text  { margin-bottom: 16px; }
}
@media (min-width: 640px) {
  .card { max-width: 460px; padding: 40px 34px 34px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .heart { display: none; }
}

  </style>
</head>

  <div class="bg" aria-hidden="true">

  var SLIDES = [

  /* ---------- Ikon (SVG inline) --------------------------------------------- */
  var ICON_HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 2.6 4.5 6.3 4.5c2.1 0 3.9 1.1 5.7 3.2 1.8-2.1 3.6-3.2 5.7-3.2 3.7 0 5.5 3.8 3.9 7.3C19.5 16.4 12 21 12 21z"/></svg>';

  /* ---------- Elemen -------------------------------------------------------- */
  var slideEl    = document.getElementById("slide");
  var progressEl = document.getElementById("progress");
  var heartsEl   = document.getElementById("hearts");
  var musicBtn   = document.getElementById("music-btn");
  var audio      = document.getElementById("bgm");

  var index = 0;
  var busy = false;
  var typeTimer = null;

  /* ==========================================================================
     MUSIK
     - Autoplay dicoba saat halaman dibuka.
     - Browser bisa memblokir autoplay -> musik otomatis mulai di sentuhan /
       klik pertama. Status tombol selalu mengikuti kondisi audio yang nyata.
     - Kalau pengguna sengaja mematikan, tidak dinyalakan lagi otomatis.
     ========================================================================== */
  var userMuted = false;

  function paintMusic(on) {
    musicBtn.dataset.state = on ? "on" : "off";
    musicBtn.setAttribute("aria-pressed", on ? "true" : "false");
    musicBtn.setAttribute("aria-label", on ? "Matikan musik" : "Nyalakan musik");
  }

  function playMusic() {
    audio.loop = true;
    var p = audio.play();
    if (p && typeof p.then === "function") {
      return p.then(function () { paintMusic(true); return true; })
              .catch(function () { paintMusic(false); return false; });
    }
    paintMusic(!audio.paused);
    return Promise.resolve(!audio.paused);
  }

  function pauseMusic() {
    audio.pause();
    paintMusic(false);
  }

  audio.addEventListener("playing", function () { paintMusic(true); });
  audio.addEventListener("pause",   function () { paintMusic(false); });

  musicBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (audio.paused) { userMuted = false; playMusic(); }
    else              { userMuted = true;  pauseMusic(); }
  });

  // Autoplay saat load
  audio.volume = 0.85;
  playMusic();

  // Fallback: mulai pada interaksi pertama bila autoplay diblokir
  function unlockOnFirstGesture() {
    if (userMuted) return;
    if (audio.paused) playMusic();
    if (!audio.paused) removeGestureListeners();
  }
  var gestureEvents = ["pointerdown", "touchstart", "keydown", "click"];
  function removeGestureListeners() {
    gestureEvents.forEach(function (ev) { document.removeEventListener(ev, unlockOnFirstGesture, true); });
  }
  gestureEvents.forEach(function (ev) { document.addEventListener(ev, unlockOnFirstGesture, true); });

  // Saat tab kembali aktif, lanjutkan bila tidak dimatikan pengguna
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !userMuted && audio.paused) playMusic();
  });

  /* ==========================================================================
     SLIDE
     ========================================================================== */
  function buildProgress() {
    progressEl.innerHTML = "";
    for (var i = 0; i < SLIDES.length; i++) progressEl.appendChild(document.createElement("i"));
  }
  function paintProgress() {
    var dots = progressEl.children;
    for (var i = 0; i < dots.length; i++) {
      dots[i].className = i < index ? "done" : (i === index ? "now" : "");
    }
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function buttonHTML(label) {
    // label boleh mengandung "<3" dari teks asli -> di-escape
    return '<button class="btn" type="button" data-next>' + esc(label) + "</button>";
  }

  function slideHTML(s) {
    var h = "";

    if (s.type === "gif") {
      h += '<figure class="gif gif--' + s.tone + '"><img src="' + s.src + '" alt="" decoding="async"></figure>';
      if (s.title)   h += '<h1 class="title">' + s.title + "</h1>";
      if (s.kaomoji) h += '<p class="kaomoji">' + esc(s.kaomoji) + "</p>";
      if (s.text)    h += '<p class="text' + (s.lead ? " text--lead" : "") + '">' + s.text + "</p>";
      h += buttonHTML(s.button);
    }

    else if (s.type === "photos") {
      var kind = s.images.length > 1 ? "pair" : "single";
      h += '<div class="photos photos--' + kind + '">';
      s.images.forEach(function (src) {
        h += '<figure class="polaroid" style="margin:0"><img src="' + src + '" alt="" decoding="async"></figure>';
      });
      h += "</div>";
      h += '<p class="text text--lead">' + s.text + "</p>";
      if (s.sub) h += '<p class="text text--sub">' + s.sub + "</p>";
      h += buttonHTML(s.button);
    }

    else if (s.type === "letter") {
      h += '<div class="letter-head"><h2 class="title">' + s.title + "</h2>";
      h += '<p class="kaomoji" style="margin:0">' + esc(s.kaomoji) + "</p></div>";
      h += '<div class="letter"><div class="letter__body" id="letter-body"><p class="letter__text typing" id="letter-text"></p></div></div>';
      h += '<div class="letter-actions">';
      h += '<button class="btn btn--ghost" type="button" data-skip>Lewati animasi</button>';
      h += '<button class="btn" type="button" data-next>' + ICON_HEART + esc(s.button) + "</button>";
      h += "</div>";
    }
    return h;
  }

  function stopTyping() {
    if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
  }

  function startTyping(full) {
    var target = document.getElementById("letter-text");
    var body   = document.getElementById("letter-body");
    var skip   = slideEl.querySelector("[data-skip]");
    if (!target) return;

    var i = 0;
    function finish() {
      stopTyping();
      target.textContent = full;
      target.classList.remove("typing");
      if (skip) skip.hidden = true;
    }
    if (skip) skip.addEventListener("click", finish);

    (function tick() {
      if (i >= full.length) { target.classList.remove("typing"); if (skip) skip.hidden = true; return; }
      i++;
      target.textContent = full.slice(0, i);
      body.scrollTop = body.scrollHeight;
      var ch = full.charAt(i - 1);
      var delay = (ch === "\n") ? 220 : (ch === "," || ch === "." || ch === "!") ? 110 : 32;
      typeTimer = setTimeout(tick, delay);
    })();
  }

  function confettiHearts() {
    // Ledakan hati kecil di kartu (tanpa library)
    var card = document.getElementById("card").getBoundingClientRect();
    var cx = card.left + card.width / 2;
    var cy = card.top + Math.min(card.height * 0.35, 220);
    var colors = ["#ff85ab", "#f2578a", "#ffb3cb", "#cf9ee0", "#ffffff"];
    for (var n = 0; n < 26; n++) {
      var el = document.createElement("span");
      el.className = "burst";
      el.innerHTML = ICON_HEART;
      var ang = Math.random() * Math.PI * 2;
      var dist = 80 + Math.random() * 150;
      el.style.cssText =
        "position:fixed;left:" + cx + "px;top:" + cy + "px;width:" + (10 + Math.random() * 14) + "px;" +
        "color:" + colors[n % colors.length] + ";pointer-events:none;z-index:60;" +
        "transition:transform " + (900 + Math.random() * 700) + "ms cubic-bezier(.16,1,.3,1)," +
        "opacity " + (1200 + Math.random() * 600) + "ms ease;will-change:transform,opacity;";
      el.firstChild.style.cssText = "width:100%;height:auto;display:block;fill:currentColor";
      document.body.appendChild(el);
      (function (e, dx, dy) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            e.style.transform = "translate(" + dx + "px," + dy + "px) rotate(" + (Math.random() * 120 - 60) + "deg)";
            e.style.opacity = "0";
          });
        });
        setTimeout(function () { e.remove(); }, 2200);
      })(el, Math.cos(ang) * dist, Math.sin(ang) * dist - 40);
    }
  }

  function render(i, animate) {
    var s = SLIDES[i];
    stopTyping();
    slideEl.className = "slide";
    slideEl.innerHTML = slideHTML(s);
    paintProgress();
    // preload gambar slide berikutnya
    var nxt = SLIDES[(i + 1) % SLIDES.length];
    (nxt.images || (nxt.src ? [nxt.src] : [])).forEach(function (u) { var im = new Image(); im.src = u; });

    if (animate !== false) { void slideEl.offsetWidth; slideEl.classList.add("is-in"); }

    if (s.type === "letter") {
      startTyping(s.letter);
      confettiHearts();
    }
    busy = false;
  }

  function goNext() {
    if (busy) return;
    busy = true;
    slideEl.classList.remove("is-in");
    slideEl.classList.add("is-out");
    setTimeout(function () {
      index = (index + 1) % SLIDES.length;
      render(index);
    }, 300);
  }

  slideEl.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-next]") : null;
    if (t) goNext();
  });

  /* ==========================================================================
     HATI MELAYANG (SVG, ringan)
     ========================================================================== */
  function spawnHearts() {
    var colors = ["#ff85ab", "#f2578a", "#ffb3cb", "#e6a0d4", "#ff9dbd"];
    var count = window.innerWidth < 520 ? 14 : 22;
    for (var i = 0; i < count; i++) {
      var h = document.createElement("span");
      h.className = "heart";
      h.innerHTML = ICON_HEART;
      h.style.left = (Math.random() * 100) + "%";
      h.style.setProperty("--s", (10 + Math.random() * 20).toFixed(1) + "px");
      h.style.setProperty("--c", colors[i % colors.length]);
      h.style.setProperty("--d", (12 + Math.random() * 12).toFixed(1) + "s");
      h.style.setProperty("--delay", (-Math.random() * 20).toFixed(1) + "s");
      h.style.setProperty("--x", ((Math.random() * 60) - 30).toFixed(0) + "px");
      h.style.setProperty("--o", (0.3 + Math.random() * 0.35).toFixed(2));
      heartsEl.appendChild(h);
    }
  }

  /* ---------- Mulai --------------------------------------------------------- */
  buildProgress();
  spawnHearts();
  render(0, true);
})();
